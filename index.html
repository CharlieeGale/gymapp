<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Iron Log</title>

<!-- iOS home-screen / standalone app behavior -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<meta name="theme-color" content="#16181C">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#16181C;
    --panel:#202329;
    --panel-alt:#282c33;
    --line:#33373f;
    --text:#EDEBE6;
    --muted:#8B8F98;
    --accent:#E5484D;
    --accent-dim:#7a2a2c;
    --pr:#F2B705;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    overscroll-behavior-y:none;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  header.top{
    padding:20px 20px 12px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  header.top h1{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:22px;
    letter-spacing:0.02em;
    margin:0;
  }
  header.top h1 span{color:var(--accent);}
  header.top .today{
    font-size:13px;
    color:var(--muted);
  }

  main{
    flex:1;
    padding:16px 16px 96px;
    overflow-y:auto;
  }
  .view{display:none;}
  .view.active{display:block;}

  /* ---- Shared panels ---- */
  .entry-panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px;
    margin-bottom:16px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  .field input, .field select{
    width:100%;
    background:var(--panel-alt);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:12px 14px;
    font-size:16px;
    font-family:'Inter',sans-serif;
  }
  .field input:focus, .field select:focus{
    outline:none;
    border-color:var(--accent);
  }
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .num-display{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:44px;
    line-height:1;
    letter-spacing:0.01em;
  }
  .num-sub{font-size:12px; color:var(--muted); margin-top:2px;}

  button.primary{
    width:100%;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:14px;
    font-size:15px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    margin-top:4px;
  }
  button.primary:active{background:#c93d42;}
  button.secondary{
    width:100%;
    background:transparent;
    color:var(--text);
    border:1px solid var(--line);
    border-radius:8px;
    padding:13px;
    font-size:14px;
    font-weight:500;
    font-family:'Inter',sans-serif;
    cursor:pointer;
  }

  .today-list{margin-top:4px;}
  .set-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .set-row:last-child{border-bottom:none;}
  .set-row .ex-name{font-size:14px; font-weight:500;}
  .set-row .ex-sub{font-size:11px; color:var(--muted); margin-top:2px;}
  .set-row .ex-detail{
    font-family:'Oswald',sans-serif;
    font-size:18px;
    color:var(--text);
  }
  .set-row .ex-detail .unit{font-size:12px; color:var(--muted); font-family:'Inter',sans-serif;}
  .del-btn{
    background:none; border:none; color:var(--muted); font-size:18px; padding:4px 8px; cursor:pointer;
  }

  .section-label{
    font-size:12px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin:20px 0 10px;
  }

  /* ---- History view ---- */
  .day-group{margin-bottom:20px;}
  .day-header{
    font-family:'Oswald',sans-serif;
    font-size:15px;
    color:var(--muted);
    margin-bottom:6px;
    border-bottom:1px solid var(--line);
    padding-bottom:6px;
  }

  /* ---- Progress view ---- */
  .picker-row{margin-bottom:16px;}
  .stat-cards{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
  .stat-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
  }
  .stat-card .label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em;}
  .stat-card .value{font-family:'Oswald',sans-serif; font-size:28px; font-weight:600; margin-top:4px;}
  .stat-card .value.pr{color:var(--pr);}

  .chart-wrap{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 12px;
  }
  .empty-state{
    color:var(--muted);
    font-size:14px;
    text-align:center;
    padding:40px 20px;
    line-height:1.6;
  }

  /* ---- Food search results ---- */
  .search-results{margin-top:10px;}
  .search-result-row{
    padding:10px 12px;
    background:var(--panel-alt);
    border:1px solid var(--line);
    border-radius:8px;
    margin-bottom:6px;
    cursor:pointer;
    font-size:13px;
  }
  .search-result-row .sr-name{font-weight:500;}
  .search-result-row .sr-sub{color:var(--muted); font-size:11px; margin-top:2px;}

  /* ---- Modals (scanner + add-food) ---- */
  .scanner-modal{
    position:fixed; inset:0;
    background:rgba(10,11,13,0.96);
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .scanner-modal video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
  }
  .scanner-frame{
    position:relative;
    width:70%;
    aspect-ratio:1.6/1;
    border:2px solid var(--accent);
    border-radius:12px;
    box-shadow:0 0 0 999px rgba(10,11,13,0.5);
  }
  .scanner-hint{
    position:absolute;
    bottom:14%;
    left:0; right:0;
    text-align:center;
    color:var(--text);
    font-size:13px;
  }
  .scanner-close{
    position:absolute;
    top:calc(env(safe-area-inset-top) + 16px);
    right:20px;
    background:rgba(32,35,41,0.9);
    border:1px solid var(--line);
    color:var(--text);
    width:36px; height:36px;
    border-radius:50%;
    font-size:16px;
    cursor:pointer;
  }
  .add-food-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:22px;
    width:85%;
    max-width:360px;
  }
  .add-food-card h3{
    font-family:'Oswald',sans-serif;
    font-weight:500;
    font-size:18px;
    margin:0 0 16px;
  }

  /* ---- Tab bar ---- */
  nav.tabbar{
    position:fixed;
    bottom:0; left:0; right:0;
    max-width:520px;
    margin:0 auto;
    background:rgba(22,24,28,0.92);
    backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    display:flex;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.tabbar button{
    flex:1;
    background:none;
    border:none;
    color:var(--muted);
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    font-weight:500;
    padding:12px 0 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    cursor:pointer;
  }
  nav.tabbar button .dot{
    width:5px; height:5px; border-radius:50%; background:transparent;
  }
  nav.tabbar button.active{color:var(--text);}
  nav.tabbar button.active .dot{background:var(--accent);}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <h1>IRON<span>LOG</span></h1>
    <div class="today" id="todayDate"></div>
  </header>

  <main>

    <!-- LOG VIEW (workouts) -->
    <section class="view active" id="view-log">
      <div class="entry-panel">
        <div class="field">
          <label for="exerciseInput">Exercise</label>
          <input list="exerciseOptions" id="exerciseInput" placeholder="e.g. Back Squat" autocomplete="off">
          <datalist id="exerciseOptions"></datalist>
        </div>
        <div class="row3">
          <div class="field">
            <label for="weightInput">Weight (kg)</label>
            <input type="number" id="weightInput" inputmode="decimal" placeholder="0">
          </div>
          <div class="field">
            <label for="repsInput">Reps</label>
            <input type="number" id="repsInput" inputmode="numeric" placeholder="0">
          </div>
          <div class="field">
            <label for="setsInput">Sets</label>
            <input type="number" id="setsInput" inputmode="numeric" value="1">
          </div>
        </div>
        <button class="primary" id="addSetBtn">Log set</button>
      </div>

      <div class="section-label">Today</div>
      <div class="today-list" id="todayList">
        <div class="empty-state">No sets logged yet today. Add one above.</div>
      </div>
    </section>

    <!-- FOOD VIEW (nutrition) -->
    <section class="view" id="view-food">
      <div class="stat-cards">
        <div class="stat-card">
          <div class="label">Today's calories</div>
          <div class="value" id="foodTotalKcal">0</div>
        </div>
        <div class="stat-card">
          <div class="label">Protein · Carbs · Fat</div>
          <div class="value" id="foodMacros" style="font-size:15px;">— · — · —</div>
        </div>
      </div>

      <div class="entry-panel">
        <button class="primary" id="scanBarcodeBtn">Scan barcode</button>
        <div class="field" style="margin-top:14px;">
          <label for="foodSearchInput">Or search a food by name</label>
          <input type="text" id="foodSearchInput" placeholder="e.g. Greek yogurt" autocomplete="off">
        </div>
        <div class="search-results" id="foodSearchResults"></div>
      </div>

      <div class="section-label">Today's food</div>
      <div id="foodTodayList">
        <div class="empty-state">No food logged yet today.</div>
      </div>
    </section>

    <!-- HISTORY VIEW -->
    <section class="view" id="view-history">
      <div id="historyList">
        <div class="empty-state">Your logged sets will show up here, grouped by day.</div>
      </div>
    </section>

    <!-- PROGRESS VIEW -->
    <section class="view" id="view-progress">
      <div class="picker-row">
        <div class="field">
          <label for="progressExercise">Exercise</label>
          <select id="progressExercise"></select>
        </div>
      </div>
      <div class="stat-cards">
        <div class="stat-card">
          <div class="label">Best set (est. 1RM)</div>
          <div class="value pr" id="bestOneRM">—</div>
        </div>
        <div class="stat-card">
          <div class="label">Last logged</div>
          <div class="value" id="lastLogged">—</div>
        </div>
      </div>
      <div class="chart-wrap">
        <svg id="progressChart" viewBox="0 0 100 40" width="100%" height="180" preserveAspectRatio="none"></svg>
      </div>
    </section>

  </main>

  <nav class="tabbar">
    <button class="tab-btn active" data-view="log"><span>Log</span><span class="dot"></span></button>
    <button class="tab-btn" data-view="food"><span>Food</span><span class="dot"></span></button>
    <button class="tab-btn" data-view="history"><span>History</span><span class="dot"></span></button>
    <button class="tab-btn" data-view="progress"><span>Progress</span><span class="dot"></span></button>
  </nav>

  <!-- Barcode scanner overlay -->
  <div id="scannerModal" class="scanner-modal" style="display:none;">
    <video id="scannerVideo" autoplay playsinline muted></video>
    <div class="scanner-frame"></div>
    <div class="scanner-hint">Point camera at the barcode</div>
    <button class="scanner-close" id="closeScannerBtn">✕</button>
  </div>

  <!-- Confirm/quantity modal after scan or search select -->
  <div id="addFoodModal" class="scanner-modal" style="display:none;">
    <div class="add-food-card">
      <h3 id="addFoodName">Item</h3>
      <div class="field">
        <label for="addFoodGrams">Amount (g)</label>
        <input type="number" id="addFoodGrams" value="100" inputmode="decimal">
      </div>
      <div class="num-display" id="addFoodKcalPreview">0<span class="num-sub" style="font-size:14px; margin-left:6px;">kcal</span></div>
      <div style="height:16px;"></div>
      <button class="primary" id="confirmAddFoodBtn">Add to log</button>
      <div style="height:8px;"></div>
      <button class="secondary" id="cancelAddFoodBtn">Cancel</button>
    </div>
  </div>

</div>

<script>
// =========================================================
// Storage
// =========================================================
const SETS_KEY = 'ironlog.sets.v1';
const FOOD_KEY = 'ironlog.food.v1';

function loadJSON(key){
  try{ return JSON.parse(localStorage.getItem(key)) || []; }catch(e){ return []; }
}
function saveJSON(key, data){ localStorage.setItem(key, JSON.stringify(data)); }

let sets = loadJSON(SETS_KEY);
let foodEntries = loadJSON(FOOD_KEY);

// =========================================================
// Helpers
// =========================================================
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
}
function epley1RM(weight, reps){
  if(reps <= 1) return weight;
  return Math.round(weight * (1 + reps/30));
}
function uniqueExercises(){
  return [...new Set(sets.map(s => s.exercise))].sort((a,b)=>a.localeCompare(b));
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// =========================================================
// Workout rendering
// =========================================================
function renderExerciseOptions(){
  const dl = document.getElementById('exerciseOptions');
  dl.innerHTML = uniqueExercises().map(n => `<option value="${escapeHtml(n)}">`).join('');
  const sel = document.getElementById('progressExercise');
  const names = uniqueExercises();
  const prevVal = sel.value;
  sel.innerHTML = names.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
  if(names.includes(prevVal)) sel.value = prevVal;
}

function renderTodayList(){
  const list = document.getElementById('todayList');
  const t = todayISO();
  const todays = sets.filter(s => s.date === t).sort((a,b)=> b.ts - a.ts);
  if(todays.length === 0){
    list.innerHTML = '<div class="empty-state">No sets logged yet today. Add one above.</div>';
    return;
  }
  list.innerHTML = todays.map(s => `
    <div class="set-row" data-id="${s.id}">
      <div class="ex-name">${escapeHtml(s.exercise)}</div>
      <div style="display:flex; align-items:center; gap:14px;">
        <div class="ex-detail">${s.weight}<span class="unit">kg</span> × ${s.reps}<span class="unit">${s.setCount>1 ? ' × '+s.setCount+' sets':''}</span></div>
        <button class="del-btn" onclick="deleteSet('${s.id}')">✕</button>
      </div>
    </div>
  `).join('');
}

function renderHistory(){
  const container = document.getElementById('historyList');
  if(sets.length === 0){
    container.innerHTML = '<div class="empty-state">Your logged sets will show up here, grouped by day.</div>';
    return;
  }
  const byDate = {};
  sets.forEach(s => { (byDate[s.date] = byDate[s.date] || []).push(s); });
  const dates = Object.keys(byDate).sort((a,b) => b.localeCompare(a));
  container.innerHTML = dates.map(date => `
    <div class="day-group">
      <div class="day-header">${fmtDate(date)}</div>
      ${byDate[date].sort((a,b)=>b.ts-a.ts).map(s => `
        <div class="set-row" data-id="${s.id}">
          <div class="ex-name">${escapeHtml(s.exercise)}</div>
          <div style="display:flex; align-items:center; gap:14px;">
            <div class="ex-detail">${s.weight}<span class="unit">kg</span> × ${s.reps}${s.setCount>1 ? ' × '+s.setCount+'<span class=\"unit\"> sets</span>':''}</div>
            <button class="del-btn" onclick="deleteSet('${s.id}')">✕</button>
          </div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

function renderProgress(){
  const sel = document.getElementById('progressExercise');
  const exercise = sel.value;
  const bestEl = document.getElementById('bestOneRM');
  const lastEl = document.getElementById('lastLogged');
  const chart = document.getElementById('progressChart');

  if(!exercise){
    bestEl.textContent = '—';
    lastEl.textContent = '—';
    chart.innerHTML = '<foreignObject x="0" y="0" width="100" height="40"><div xmlns="http://www.w3.org/1999/xhtml" style="color:#8B8F98; font-family:Inter,sans-serif; font-size:4px; text-align:center; padding-top:16px;">Log a set to see progress here.</div></foreignObject>';
    return;
  }

  const rows = sets.filter(s => s.exercise === exercise).sort((a,b)=>a.ts-b.ts);
  const best = Math.max(...rows.map(r => epley1RM(r.weight, r.reps)));
  bestEl.textContent = best + ' kg';
  const last = rows[rows.length-1];
  lastEl.textContent = last ? `${last.weight}×${last.reps}` : '—';

  const points = rows.map(r => epley1RM(r.weight, r.reps));
  if(points.length < 2){
    chart.innerHTML = points.length === 1
      ? '<foreignObject x="0" y="0" width="100" height="40"><div xmlns="http://www.w3.org/1999/xhtml" style="color:#8B8F98; font-family:Inter,sans-serif; font-size:4px; text-align:center; padding-top:16px;">Log one more set to see a trend line.</div></foreignObject>'
      : '';
    return;
  }
  const min = Math.min(...points), max = Math.max(...points);
  const range = max - min || 1;
  const stepX = 100 / (points.length - 1);
  const coords = points.map((p,i) => {
    const x = i * stepX;
    const y = 38 - ((p - min) / range) * 34;
    return [x,y];
  });
  const path = coords.map((c,i) => (i===0?'M':'L') + c[0].toFixed(2) + ',' + c[1].toFixed(2)).join(' ');
  const dots = coords.map(c => `<circle cx="${c[0].toFixed(2)}" cy="${c[1].toFixed(2)}" r="1.4" fill="#E5484D"/>`).join('');
  chart.innerHTML = `<path d="${path}" fill="none" stroke="#E5484D" stroke-width="0.8" vector-effect="non-scaling-stroke"/>${dots}`;
}

function addSet(){
  const exercise = document.getElementById('exerciseInput').value.trim();
  const weight = parseFloat(document.getElementById('weightInput').value);
  const reps = parseInt(document.getElementById('repsInput').value, 10);
  const setCount = parseInt(document.getElementById('setsInput').value, 10) || 1;

  if(!exercise || isNaN(weight) || isNaN(reps)){
    alert('Fill in exercise, weight, and reps.');
    return;
  }

  sets.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    exercise, weight, reps, setCount,
    date: todayISO(),
    ts: Date.now()
  });
  saveJSON(SETS_KEY, sets);

  document.getElementById('weightInput').value = '';
  document.getElementById('repsInput').value = '';
  document.getElementById('setsInput').value = '1';

  renderAll();
}
function deleteSet(id){
  sets = sets.filter(s => s.id !== id);
  saveJSON(SETS_KEY, sets);
  renderAll();
}
window.deleteSet = deleteSet;

// =========================================================
// Food / nutrition
// =========================================================
const OFF_PRODUCT_URL = code => `https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json`;
const OFF_SEARCH_URL = q => `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=8`;

let currentFoodItem = null; // { name, kcal100, protein100, carbs100, fat100 }
let scannerControls = null;
let searchDebounceTimer = null;

function mapOffProduct(p){
  const n = p.nutriments || {};
  return {
    name: p.product_name || p.generic_name || 'Unknown item',
    brand: p.brands || '',
    kcal100: Number(n['energy-kcal_100g'] ?? n['energy-kcal'] ?? 0),
    protein100: Number(n['proteins_100g'] ?? 0),
    carbs100: Number(n['carbohydrates_100g'] ?? 0),
    fat100: Number(n['fat_100g'] ?? 0)
  };
}

function renderFoodToday(){
  const list = document.getElementById('foodTodayList');
  const t = todayISO();
  const todays = foodEntries.filter(f => f.date === t).sort((a,b)=>b.ts-a.ts);

  let totalKcal = 0, totalP = 0, totalC = 0, totalF = 0;
  todays.forEach(f => { totalKcal += f.kcal; totalP += f.protein; totalC += f.carbs; totalF += f.fat; });

  document.getElementById('foodTotalKcal').textContent = Math.round(totalKcal);
  document.getElementById('foodMacros').textContent =
    `${Math.round(totalP)}g · ${Math.round(totalC)}g · ${Math.round(totalF)}g`;

  if(todays.length === 0){
    list.innerHTML = '<div class="empty-state">No food logged yet today.</div>';
    return;
  }
  list.innerHTML = todays.map(f => `
    <div class="set-row" data-id="${f.id}">
      <div>
        <div class="ex-name">${escapeHtml(f.name)}</div>
        <div class="ex-sub">${f.grams}g</div>
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <div class="ex-detail">${Math.round(f.kcal)}<span class="unit"> kcal</span></div>
        <button class="del-btn" onclick="deleteFood('${f.id}')">✕</button>
      </div>
    </div>
  `).join('');
}
function deleteFood(id){
  foodEntries = foodEntries.filter(f => f.id !== id);
  saveJSON(FOOD_KEY, foodEntries);
  renderFoodToday();
}
window.deleteFood = deleteFood;

function openAddFoodModal(item){
  currentFoodItem = item;
  document.getElementById('addFoodName').textContent = item.brand ? `${item.name} (${item.brand})` : item.name;
  document.getElementById('addFoodGrams').value = 100;
  updateAddFoodPreview();
  document.getElementById('addFoodModal').style.display = 'flex';
}
function updateAddFoodPreview(){
  const grams = parseFloat(document.getElementById('addFoodGrams').value) || 0;
  const kcal = currentFoodItem ? (currentFoodItem.kcal100 / 100) * grams : 0;
  document.getElementById('addFoodKcalPreview').innerHTML = `${Math.round(kcal)}<span class="num-sub" style="font-size:14px; margin-left:6px;">kcal</span>`;
}
function closeAddFoodModal(){
  document.getElementById('addFoodModal').style.display = 'none';
  currentFoodItem = null;
}
function confirmAddFood(){
  if(!currentFoodItem) return;
  const grams = parseFloat(document.getElementById('addFoodGrams').value) || 0;
  const factor = grams / 100;
  foodEntries.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    name: currentFoodItem.name,
    grams,
    kcal: currentFoodItem.kcal100 * factor,
    protein: currentFoodItem.protein100 * factor,
    carbs: currentFoodItem.carbs100 * factor,
    fat: currentFoodItem.fat100 * factor,
    date: todayISO(),
    ts: Date.now()
  });
  saveJSON(FOOD_KEY, foodEntries);
  closeAddFoodModal();
  document.getElementById('foodSearchInput').value = '';
  document.getElementById('foodSearchResults').innerHTML = '';
  renderFoodToday();
}

async function lookupBarcode(code){
  try{
    const res = await fetch(OFF_PRODUCT_URL(code));
    const data = await res.json();
    if(data.status === 1 && data.product){
      openAddFoodModal(mapOffProduct(data.product));
    } else {
      alert('No product found for that barcode. Try searching by name instead.');
    }
  }catch(e){
    alert('Could not reach the food database. Check your connection and try again.');
  }
}

async function runFoodSearch(query){
  const resultsEl = document.getElementById('foodSearchResults');
  if(query.length < 3){ resultsEl.innerHTML = ''; return; }
  try{
    const res = await fetch(OFF_SEARCH_URL(query));
    const data = await res.json();
    const products = (data.products || []).filter(p => p.product_name).slice(0, 8);
    if(products.length === 0){
      resultsEl.innerHTML = '<div class="empty-state" style="padding:16px;">No matches. Try a different search term.</div>';
      return;
    }
    resultsEl.innerHTML = products.map((p, i) => `
      <div class="search-result-row" data-idx="${i}">
        <div class="sr-name">${escapeHtml(p.product_name)}</div>
        <div class="sr-sub">${escapeHtml(p.brands || '')} ${p.nutriments && p.nutriments['energy-kcal_100g'] ? '· ' + Math.round(p.nutriments['energy-kcal_100g']) + ' kcal/100g' : ''}</div>
      </div>
    `).join('');
    resultsEl.querySelectorAll('.search-result-row').forEach(row => {
      row.addEventListener('click', () => {
        const idx = parseInt(row.dataset.idx, 10);
        openAddFoodModal(mapOffProduct(products[idx]));
      });
    });
  }catch(e){
    resultsEl.innerHTML = '<div class="empty-state" style="padding:16px;">Search failed. Check your connection.</div>';
  }
}

async function startScanner(){
  const modal = document.getElementById('scannerModal');
  const video = document.getElementById('scannerVideo');
  modal.style.display = 'flex';
  try{
    const { BrowserMultiFormatReader } = await import('https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.4/+esm');
    const reader = new BrowserMultiFormatReader();
    scannerControls = await reader.decodeFromConstraints(
      { video: { facingMode: 'environment' } },
      video,
      (result, err) => {
        if(result){
          const code = result.getText();
          stopScanner();
          lookupBarcode(code);
        }
      }
    );
  }catch(e){
    stopScanner();
    alert('Could not access the camera. You can search by name instead.');
  }
}
function stopScanner(){
  if(scannerControls){
    try{ scannerControls.stop(); }catch(e){}
    scannerControls = null;
  }
  document.getElementById('scannerModal').style.display = 'none';
}

// =========================================================
// Tab navigation
// =========================================================
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-' + btn.dataset.view).classList.add('active');
    if(btn.dataset.view === 'progress') renderProgress();
    if(btn.dataset.view === 'food') renderFoodToday();
  });
});
document.getElementById('progressExercise').addEventListener('change', renderProgress);
document.getElementById('addSetBtn').addEventListener('click', addSet);

document.getElementById('scanBarcodeBtn').addEventListener('click', startScanner);
document.getElementById('closeScannerBtn').addEventListener('click', stopScanner);
document.getElementById('cancelAddFoodBtn').addEventListener('click', closeAddFoodModal);
document.getElementById('confirmAddFoodBtn').addEventListener('click', confirmAddFood);
document.getElementById('addFoodGrams').addEventListener('input', updateAddFoodPreview);
document.getElementById('foodSearchInput').addEventListener('input', (e) => {
  clearTimeout(searchDebounceTimer);
  const q = e.target.value.trim();
  searchDebounceTimer = setTimeout(() => runFoodSearch(q), 400);
});

// =========================================================
// Init
// =========================================================
function renderAll(){
  renderExerciseOptions();
  renderTodayList();
  renderHistory();
  renderProgress();
  renderFoodToday();
}

document.getElementById('todayDate').textContent = new Date().toLocaleDateString(undefined, {weekday:'long', month:'short', day:'numeric'});
renderAll();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
